        return s.exportKey('raw', key).then(function (raw) { store(function () { sessionStorage.setItem(KEYS, b64(raw)); }); return buf; });
      });
    })
    .then(function (buf) {
      store(function () { localStorage.setItem(KEY, pin); });
      var html = new TextDecoder().decode(buf);
      document.open(); document.write(html); document.close();
    });
}
function ask() {
  var form = document.getElementById('gate'), input = document.getElementById('pin'), msg = document.getElementById('msg');
  form.hidden = false; input.focus();
  form.onsubmit = function (e) {
    e.preventDefault(); msg.textContent = 'Opening…';
    unlock(input.value.trim()).catch(function () { msg.textContent = 'That PIN is not right.'; input.select(); });
  };
}
if (location.hash === '#lock') { store(function () { localStorage.removeItem(KEY); sessionStorage.clear(); }); history.replaceState(null, '', location.pathname); }
var saved = store(function () { return localStorage.getItem(KEY); });
var kept = store(function () { return sessionStorage.getItem(KEYS); });
function fromPin() {
  if (saved) unlock(saved).catch(function () { store(function () { localStorage.removeItem(KEY); }); ask(); });
  else ask();
}
if (kept && saved) {
  crypto.subtle.importKey('raw', bytes(kept), 'AES-GCM', false, ['decrypt']).then(open).then(function (buf) {
    var html = new TextDecoder().decode(buf);
    document.open(); document.write(html); document.close();
  }).catch(fromPin);
} else fromPin();
</script>
