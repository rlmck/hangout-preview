function bytes(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }

function open(key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(P.iv) }, key, bytes(P.data)); }
