var KEY = 'hangout-preview-pin';
function bytes(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
function store(fn) { try { return fn(); } catch (e) { return null; } }
var KEYS = 'hangout-preview-key:' + P.salt;
function b64(buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); }
function open(key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(P.iv) }, key, bytes(P.data)); }
function unlock(pin) {
